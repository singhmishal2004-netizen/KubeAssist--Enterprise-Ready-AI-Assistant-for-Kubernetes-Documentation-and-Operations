
services:
  # ==========================================
  # FastAPI Backend
  # ==========================================
  - type: web
    name: kubeassist-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements-render.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: PORTKEY_API_KEY
        sync: false

      - key: GROQ_SLUG
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: QDRANT_API_KEY
        sync: false

      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false

      - key: QDRANT_COLLECTION_NAME
        value: kubeassist_knowledge

      - key: JINA_API_KEY
        sync: false

      - key: LOGFIRE_TOKEN
        sync: false

  # ==========================================
  # Streamlit Frontend
  # ==========================================
  - type: web
    name: kubeassist-ui
    runtime: python
    plan: free

    buildCommand: pip install -r requirements-render.txt

    startCommand: streamlit run UI/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true

    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: kubeassist-api
          property: hostport

      - key: LOGFIRE_TOKEN
        sync: false
